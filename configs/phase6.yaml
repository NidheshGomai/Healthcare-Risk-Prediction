# Phase 6 Configuration: Explainability & Evaluation

random_state: 42

# Surrogate rule extraction settings
surrogate:
  max_depth: 3
  min_samples_leaf: 20

# Feature importance & consistency evaluation
explainability:
  top_k_list: [5, 10]
  max_shap_samples: 150
  weighting: sample_count  # uniform or sample_count

# Privacy-Utility-Explainability trade-off sweep
tradeoff:
  epsilons: [0.1, 0.5, 1.0, 2.0, 5.0, 10.0]
  n_trials: 3
